doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Give up on a database that does not accept the connection after 3 seconds
        # instead of the driver's 30, so requests and the health check fail fast.
        options:
            !php/const PDO::ATTR_TIMEOUT: 3
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # No mapping is registered yet. Each module adds its XML mapping directory
        # (src/<Module>/Infrastructure/Persistence/Mapping) when it gets an aggregate.
        auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
