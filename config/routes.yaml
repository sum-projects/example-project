# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Routes are owned by the code that serves them. Every top-level directory of src/
# imports its own controllers in its config/routes.yaml, where a channel also sets
# its prefix. See docs/03-architecture.md ("Module configuration").
#
# To list all registered routes, run the following command:
#   bin/console debug:router

modules:
    resource: '../src/*/config/routes.yaml'
