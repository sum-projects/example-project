# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# The application registers no services here. Every top-level directory of src/
# (a module, Shared, Delivery) wires itself in its own config/ directory, which
# mirrors this one: packages/*.yaml holds its slice of bundle configuration and
# services.yaml its services. See docs/03-architecture.md ("Module configuration").
imports:
    - { resource: '../src/*/config/packages/*.yaml' }
    - { resource: '../src/*/config/services.yaml' }
