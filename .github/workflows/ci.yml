name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Start the stack
        run: make up

      - name: Install dependencies
        run: make install

      - name: Quality gate
        run: make qa

      - name: Mutation testing
        run: make infection

      - name: Dependency audit
        run: make audit

      - name: Stack logs
        if: failure()
        run: docker compose logs
